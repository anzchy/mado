name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Heavy lanes run here instead of on the Mac mini: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:
    inputs:
      swift_filter:
        description: Optional `swift test --filter` pattern; empty runs the whole package suite
        required: false
        default: ''
      app_tests:
        description: Also build and run the App test bundle
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The package suite runs as two processes (#391): the non-UI targets, and PicseeMacUITests one test at a time,
  # because its window tests saturate the runner's main actor when Swift Testing runs them in parallel. Each run is
  # wrapped in scripts/ci/test-watchdog.mjs, which ends it 3 minutes before the job timeout with `sample`/`spindump`
  # stacks and ps CPU/RSS, and the logs, xunit results and stacks are uploaded even when the job fails.
  package-tests:
    name: Package tests (non-UI)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Watchdog script tests
        run: node --test scripts/ci/*.test.mjs
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Swift Testing (Core, Application, Infrastructure)
        env:
          SWIFT_FILTER: ${{ inputs.swift_filter }}
        run: >-
          node scripts/ci/test-watchdog.mjs --out ci-logs/package-tests --timeout-seconds 1500
          --deadline-epoch $((JOB_STARTED + 1620)) --
          swift test --package-path Packages/PicseeKit --skip 'PicseeMacUITests\.'
          --xunit-output ci-logs/package-tests/xunit.xml ${SWIFT_FILTER:+--filter "$SWIFT_FILTER"}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-tests-logs
          path: ci-logs/package-tests
          if-no-files-found: warn

  package-macui-tests:
    name: Package tests (MacUI)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Swift Testing (MacUI, serial)
        env:
          SWIFT_FILTER: ${{ inputs.swift_filter }}
        run: >-
          node scripts/ci/test-watchdog.mjs --out ci-logs/package-macui-tests --timeout-seconds 1500
          --deadline-epoch $((JOB_STARTED + 1620)) --
          swift test --package-path Packages/PicseeKit --no-parallel
          --skip '(PicseeCoreTests|PicseeApplicationTests|PicseeInfrastructureTests)\.'
          --xunit-output ci-logs/package-macui-tests/xunit.xml ${SWIFT_FILTER:+--filter "$SWIFT_FILTER"}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-macui-tests-logs
          path: ci-logs/package-macui-tests
          if-no-files-found: warn

  unsigned-build:
    name: Build unsigned app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check generated feature ledger HTML
        run: node scripts/ledger/build.mjs --check
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Build unsigned app
        run: xcodebuild build -scheme Picsee -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci

  # The required check on main keeps its name: it passes only when the three jobs above all succeeded.
  walking-skeleton:
    name: Walking skeleton
    if: always()
    needs: [package-tests, package-macui-tests, unsigned-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require package tests and the unsigned build
        env:
          RESULTS: ${{ needs.package-tests.result }} ${{ needs.package-macui-tests.result }} ${{ needs.unsigned-build.result }}
        run: |
          echo "package-tests package-macui-tests unsigned-build: $RESULTS"
          test "$RESULTS" = 'success success success'

  app-tests:
    name: App tests
    if: github.event_name != 'workflow_dispatch' || inputs.app_tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Build App tests
        run: xcodebuild build-for-testing -scheme Picsee -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci
      - name: Run App tests
        # The runner is the only job on its machine, so the local heavy lock is not needed.
        env:
          PICSEE_HEAVY_LOCK_HELD: '1'
        run: node scripts/tdd/app-lane.mjs

  design-check:
    name: Design check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned npm dev dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check design catalog and journeys
        run: npm run design:check
