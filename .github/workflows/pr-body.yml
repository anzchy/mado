name: PR body
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-tests:
    name: Agent tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # #788: skip apt when the image already has the tools; otherwise apt retries its downloads and each command is
      # tried up to 3 times (15 s, then 30 s). Only install steps retry, never a test step.
      - name: Install portable device test tools
        run: |
          if command -v python3 >/dev/null && command -v git >/dev/null && command -v zsh >/dev/null; then echo 'install: python3, git and zsh already present'; exit 0; fi
          pr-head/scripts/ci/retry.sh 3 15 sudo apt-get -o Acquire::Retries=3 update
          pr-head/scripts/ci/retry.sh 3 15 sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y python3 git zsh
      - name: Test portable device tools
        working-directory: pr-head
        run: |
          python3 -m unittest discover -s scripts/device/tests -p '*_test.py'
          node --test scripts/device/tests/device.test.cjs scripts/device/tests/platform_split.test.cjs
      - name: Test agent tooling
        working-directory: pr-head
        run: node --test scripts/agents/*.test.mjs scripts/perf/*.test.mjs scripts/ledger/*.test.mjs scripts/tdd/*.test.mjs scripts/hooks/*.test.mjs

  pr-body-gates:
    name: PR body Gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check PR body gates
        working-directory: pr-head
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q '^export function checkGates' ../trusted/scripts/agents/ui-parity-pr-body-lint.mjs; then
            echo 'trusted PR-body lint lacks checkGates; refusing to use a pre-Gates validator' >&2
            exit 1
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node ../trusted/scripts/agents/ui-parity-pr-body-lint.mjs --base origin/main --body-file "$RUNNER_TEMP/pr-body.md"
