<h1>截图与「录屏」权限</h1><p class="lead">截图需要 macOS 的「录屏与系统录音」权限，只给截图助手，Mado 看图不会获得屏幕访问。</p>
<ol><li>第一次截图时，系统会弹窗；选“允许”。</li><li>错过了？系统设置 › 隐私与安全性 › 录屏与系统录音，打开 Mado。</li><li>macOS 15 起，系统会不定期再问一次，选“允许”即可。</li></ol><p>关闭设置里的“显示截图工具条”会停止截图助手并移除登录项。</p></main></body></html>
