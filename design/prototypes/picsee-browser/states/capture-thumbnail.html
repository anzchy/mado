  The page is a whole screen (1280×800 = one display) right after a Capture: the desktop backdrop of 37 and, in the
  bottom-right corner, the Capture Thumbnail. It stays about 5 s and while the pointer is over it (spec #680 stories
  28–34, grilling 3.2); dragging it out drags the image. Actions (story 29, 31) appear on hover. 存储 appears only when
  saving after a Capture is off (decision 3.5). The bar itself is not drawn here: it can be expanded or collapsed (37).
  Buttons do nothing. Radii, shadows and colours use the design tokens; the thumbnail's hover scrim is a fixed dark
  overlay over the image (no token), its frame is --color-panel.
  The bare URL is the pinned main case: saving on, the thumbnail at rest, light. Sub-cases, by query:
    ?hover=1             the pointer over the thumbnail: dark overlay with 拷贝, 标注, 在 Mado 中打开, 识别文字, 移到废纸篓

<script>
// Static state page. ?hover=1, ?save=off, ?kind=text|notext, ?engine=cloud, ?panel=1 and ?theme=dark select a sub-case (see the header comment).
(() => {
  const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
  if (q.get('theme') === 'dark') document.documentElement.className = 'theme-dark';
  const kind = q.get('kind'), saveOff = q.get('save') === 'off';
  $('char-count').textContent = $('recognised').value.replace(/\s/g, '').length;
  if (q.get('engine') === 'cloud') for (const e of document.querySelectorAll('.engine')) e.textContent = '百度云识别';
  if (kind === 'text' || kind === 'notext') {
    const corner = $('corner'), notice = $(kind === 'text' ? 'notice-text' : 'notice-notext');
    corner.dataset.kind = kind; corner.replaceChildren(notice); notice.hidden = false;
    if (kind === 'text' && q.get('panel') === '1') { corner.hidden = true; $('panel').hidden = false; }
    return;
  }
  if (saveOff) {
    $('status').textContent = '只在剪贴板里 · 没有存储';
    for (const e of document.querySelectorAll('[data-save-on]')) e.remove();
    for (const e of document.querySelectorAll('[data-save-off]')) e.hidden = false;
  }
  if (saveOff || q.get('hover') === '1') { $('overlay').hidden = false; $('thumb-close').hidden = false; }
})();
