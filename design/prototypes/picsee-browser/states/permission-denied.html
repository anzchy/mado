<script>
// Static state page. The bare URL is the pinned main case; ?case= / ?cause= swap in a sub-case from a <template>,
// ?theme=dark switches tokens, ?drag=over shows the drop-target affordance. Buttons do nothing.
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.className = 'theme-dark';
  const t = document.getElementById('case-' + (q.get('case') || q.get('cause') || ''));
  if (t) for (const part of t.content.children) { const old = document.getElementById(part.id); if (old) old.replaceWith(part.cloneNode(true)); }
  const drop = document.querySelector('[data-drop-target]');
  if (drop) {
    if (q.get('drag') === 'over') drop.classList.add('is-drag-over');
    ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('is-drag-over'); }));
    ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('is-drag-over'); }));
  }
})();
</script>
