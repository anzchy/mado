  setup: () => dlg(TBL, '首次使用需要连接识别服务', '设置完成后即可继续；目前尚未发送图片。', B('取消') + B('开始设置', true), '设置里需要一个识别服务的访问密钥。没有的话，设置页里有获取步骤。'),
  off: () => dlg(WARN, '云识别已关闭', '识别表格需要把图片发送到识别服务。你可以在设置里打开「允许云识别」；目前尚未发送图片。', B('取消') + B('打开设置', true), '', false),
  consent: () => dlg(TBL, '将这张图片发送到 ' + SERV + ' 识别表格？', '图片会离开你的 Mac，由该服务处理，并适用其隐私政策。你可以随时在设置中关闭云识别。', B('取消') + B('同意并识别', true), '同意只对这个服务器有效；换了地址会再问一次。'),
  working: () => dlg('<span class="spin" style="margin:0"></span>', '正在识别表格…', '图片已发送到 ' + SERV + '。通常几秒到十几秒。<div class="prog"><i></i></div>', B('取消'), '取消后不会自动重试；已发送的请求可能已产生费用。'),
  result: () => panel(), edited: () => panel({ edit: 1 }), copied: () => panel({ edit: 1, toast: 1 }), more: () => panel({ edit: 1, more: 1 }),
  'fail-key': () => dlg(WARN, '服务不接受这个密钥', '没有识别，也没有拷贝任何内容。请到设置里更换密钥。', failBtns('打开设置', '重试', '仅识别文字（本机）'), '「仅识别文字」只用这台 Mac 识别，得到的是文字，不是表格；它需要你单独点一下。', true),
  'fail-none': () => dlg(WARN, '没有找到表格', '这张图片里服务没有识别出表格。可以重新框选，尽量只包含一个表格。', failBtns('重新框选', '重试', '仅识别文字（本机）'), '没有拷贝任何内容。', true),
  'fail-cut': () => dlg(WARN, '结果不完整', '服务的回复被截断了，表格可能少了行或列，所以没有当作成功。表格很长时，建议分段框选。', failBtns('重新框选', '重试', '仅识别文字（本机）'), '原图和剪贴板都没有改动。', true),
  'fail-offline': () => dlg(WARN, '无法联网', '请检查网络后重试。图片没有发送出去。', failBtns('重试', '打开设置', '仅识别文字（本机）'), '', true),
  'fail-big': () => dlg(WARN, '这张图片太大', '超过服务允许的大小，没有发送。请缩小框选范围；一个表格太密或太长时，分段识别更准。', failBtns('重新框选', '仅识别文字（本机）'), '不会悄悄缩小图片：缩小会让小字识别变差。', true),
};
document.getElementById('out').innerHTML = (S[c] || S.result)();
</script>
</body></html>
