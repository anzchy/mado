  <!--
  39 标注模式 (#680; #690 Annotate Mode skeleton, #691–#694 tools and save, ledger EDIT-07, EDIT-08). Static design state,
  not the native app. Promoted from Annotate variant D of the throwaway prototype
  design/prototypes/capture-proto/annotate.html on branch prototype/680-capture-ui (96b47f79); owner 2026-11-13:
  「A A A .the fourth: 标注模式工具栏放在右边竖排，重新更新这个Prototype」.
  The page is the viewer window (1280×800, full-size content, traffic lights at 14,13) in Annotate Mode (⌘E) on
  DSC_0342.jpg (1600×2400). The tool strip is docked on the right edge: 48 px wide, 12 px from the edge, vertically centred.
  The image is fitted to the area left of it (right inset 64 px, 16 px margins), so the strip never covers the image.
  Strip order (spec #680 stories 39–59, grilling 4.3/4.7): 选择 | 箭头 矩形 文字 荧光笔 画笔 遮挡 裁剪 序号 | 撤销 重做 |
  拷贝 存储 | 完成. Hover tips (title) carry the single-letter shortcuts of decision 5.5: V A R T H P M C N; 拷贝 ⌘C,
  存储 ⌘S, 完成 Esc. Every mark paint is fixed and the same in both appearances, with no theme token: annotation red #dc2626
  (the light value of --color-danger) for strokes, fills and text, and white #fff for the step number and the text
  mark's halo. Marks are image content and the flattened Annotated Copy must not depend on the app appearance
  (#680 r1 decision Q8, r2). The redaction slider carries no numeric range or value: the minimum strength is
  measured by the #693 implementer on test assets and recorded in its acceptance (grilling 5.3). The drawn mosaic
  is illustrative only. In windows too short for the strip it scrolls inside itself (max-height). Buttons do nothing. Radii, shadows and colours use the design tokens.
  ⌘S follows the #680 decision of 2026-11-13: stay in Annotate Mode on the original and confirm 「已存储为 <name>」 with
  在访达中显示; the open Preview Set does not change.
  The bare URL is the pinned main case: the rectangle tool active with five marks (two rectangles, an arrow, step 1 and a text mark), light. Sub-cases, by query:
    ?tool=redact         the redaction tool active: options popover left of the strip with 马赛克/实色块, 强度 and the
                         permanent reversibility hint (5.4) with 改用实色块; a mosaic mark over the gate's plaque
    ?tool=redact&style=solid   实色块 chosen: 「纯黑色块，不可还原。」, the plaque covered by a solid box
    ?saved=1             after ⌘S: 「已存储为 DSC_0342-annotated.jpg」 with 在访达中显示, centred over the image area
    ?sheet=unsaved       Esc with unsaved marks: the sheet 不存储 / 取消 / 存储
    ?theme=dark          dark tokens (combines with the others)
-->

  * { box-sizing: border-box; }
  html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }

  /* The image fitted to the area left of the strip: 1600×2400 at scale 0.32 → 512×768 at (352, 16). */
  .annotate-image { position: absolute; left: 352px; top: 16px; width: 512px; height: 768px; display: block; }

  .annotate-strip { position: absolute; z-index: 5; right: 12px; top: 50%; transform: translateY(-50%); width: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px;
                    padding: 4px; border-radius: var(--radius-popover); background: color-mix(in srgb, var(--color-panel) 72%, transparent);
                    backdrop-filter: blur(var(--tool-background-blur)) saturate(var(--tool-background-saturation)); box-shadow: var(--shadow-soft);
                    max-height: calc(100% - 24px); overflow-y: auto; }
  .annotate-strip .hsep { flex: none; width: 24px; height: 1px; margin: 4px 0; background: var(--color-border); }

  .tool[aria-pressed="true"] { background: var(--color-accent-fill); color: var(--color-on-accent); }
  .tool:disabled { opacity: .35; }
  .text-button { flex: none; width: 40px; height: 26px; padding: 0; border: 0; border-radius: var(--radius-control); background: none; font-size: var(--font-size-ui-sm); }
  .text-button.primary { background: var(--color-accent-fill); color: var(--color-on-accent); }
  /* The tool options popover, left of the strip, its nub at the active tool. */
  .tool-options { position: absolute; z-index: 6; right: 72px; width: 236px; display: grid; gap: 8px; padding: 10px 12px; border-radius: var(--radius-popover);
                  background: var(--color-panel); box-shadow: var(--shadow-soft); font-size: var(--font-size-ui-sm); }
  .tool-options::after { content: ""; position: absolute; right: -6px; top: var(--nub, 50%); width: 12px; height: 12px; margin-top: -6px; background: var(--color-panel); transform: rotate(45deg); }
  .tool-options b { font-size: var(--font-size-ui-sm); }
  .segmented { justify-self: start; display: inline-flex; padding: 2px; border-radius: var(--radius-control); background: var(--color-hover); }
  .segmented button { height: 24px; padding: 0 10px; border: 0; border-radius: var(--radius-inner); background: none; color: var(--color-muted); font-size: var(--font-size-ui-sm); }
  .segmented button[aria-pressed="true"] { background: var(--color-panel); color: var(--color-text); box-shadow: var(--shadow-soft); }
  .tool-options label { display: flex; align-items: center; gap: 6px; }
  .tool-options input[type=range] { flex: 1; margin: 0; accent-color: var(--color-accent); }
  .reversible-hint { margin: 0; line-height: 1.4; color: color-mix(in srgb, var(--color-banner-unsaved) 75%, var(--color-text)); }

                       padding: 6px 6px 6px 12px; border-radius: var(--radius-popover); background: var(--color-panel); box-shadow: var(--shadow-soft); font-size: var(--font-size-ui-sm); white-space: nowrap; }
  .save-confirmation .ok { display: inline-flex; color: var(--color-running-text); }
  .btn { height: 24px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-bg); font-size: var(--font-size-ui-sm); white-space: nowrap; }
  .btn.primary { border: 0; background: var(--color-accent-fill); color: var(--color-on-accent); }

  <p class="reversible-hint" data-mosaic-only>强度低的马赛克可能被还原出文字；真正保密的内容请用实色块。 <button type="button" class="link">改用实色块</button></p>
  <p class="muted" data-solid-only hidden>纯黑色块，不可还原。</p>
</div>

<div class="save-confirmation" id="save-confirmation" role="status" hidden>
  <span class="ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></span>
  <span>已存储为 DSC_0342-annotated.jpg</span>
  <button type="button" class="btn">在访达中显示</button>
  <button type="button" class="icon-only" aria-label="关闭" title="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<div id="unsaved" hidden>
  <div class="scrim"></div>
  <div class="sheet" role="alertdialog" aria-labelledby="unsaved-title">
    <h2 id="unsaved-title">要存储对“DSC_0342.jpg”的标注吗？</h2>
    <p>存储会另存为 DSC_0342-annotated.jpg，原图不变。不存储则丢弃这些标记。</p>
    <div class="actions"><button type="button" class="btn">不存储</button><button type="button" class="btn">取消</button><button type="button" class="btn primary">存储</button></div>
  </div>
</div>
<script>
// Static state page. ?tool=redact, ?style=solid, ?saved=1, ?sheet=unsaved and ?theme=dark select a sub-case (see the header comment).
(() => {
  const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
  if (q.get('theme') === 'dark') document.documentElement.className = 'theme-dark';
  if (q.get('saved') === '1') $('save-confirmation').hidden = false;
  if (q.get('sheet') === 'unsaved') $('unsaved').hidden = false;
  if (q.get('tool') !== 'redact') return;
  // Redaction: the tool is pressed, the plaque mark becomes a redaction, the popover's nub points at the tool.
  for (const b of document.querySelectorAll('[data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === 'redact'));
  const solid = q.get('style') === 'solid', plaque = $('mark-plaque'), pop = $('tool-options');
  const r = { x: +plaque.getAttribute('x'), y: +plaque.getAttribute('y'), w: +plaque.getAttribute('width'), h: +plaque.getAttribute('height') };
  plaque.remove();
  for (const b of pop.querySelectorAll('[data-style]')) b.setAttribute('aria-pressed', String((b.dataset.style === 'solid') === solid));
  for (const e of pop.querySelectorAll('[data-mosaic-only]')) e.hidden = solid;
  for (const e of pop.querySelectorAll('[data-solid-only]')) e.hidden = !solid;
  const box = $(solid ? 'solid' : 'mosaic');
  Object.assign(box.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }); box.hidden = false;
  if (!solid) {
    // Illustrative mosaic only: the block size is a drawing choice, not a strength value (grilling 5.3; #693 measures it).
    const img = $('annotate-image'), s = 0.32, block = 12;
    const paint = () => {
      const c = box, sw = Math.ceil(r.w / s / block), sh = Math.ceil(r.h / s / block);
      c.width = sw; c.height = sh;
      const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, (r.x - 352) / s, (r.y - 16) / s, r.w / s, r.h / s, 0, 0, sw, sh);
    };
    img.complete ? paint() : img.addEventListener('load', paint);
  }
  pop.hidden = false;
  const btn = document.querySelector('[data-tool="redact"]').getBoundingClientRect(), cy = btn.top + btn.height / 2, ph = pop.offsetHeight;
  const top = Math.max(12, Math.min(800 - ph - 12, Math.round(cy - ph / 2)));
  pop.style.top = top + 'px'; pop.style.setProperty('--nub', (cy - top) + 'px');
})();
</script>
</body></html>
