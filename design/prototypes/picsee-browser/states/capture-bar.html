  Capture Bar floating above them. Content from spec #680 and grilling 2.1–2.4: region, window and full-screen capture,
  capture and recognise text, Open Mado (no delayed capture); a drag handle; collapse to the menu bar icon. The bar is
  drawn at its default position: top centre, 32 px below the menu bar, on the display with the pointer. After a drag
  the position is remembered per display (grilling 2.2; #680 r1 decision Q1). #682 asserts the bar's size and
  internals, not its screen position. Buttons do nothing. Radii, shadows and colours use the design tokens.

    ?hover=region        the pointer over 区域截图: hover fill and its tooltip (name and shortcut)

    ?state=menu          collapsed, with the menu bar icon's menu open

    ?theme=dark          dark tokens
-->

    <button type="button" class="icon-only" aria-label="收起到菜单栏" title="收起到菜单栏"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
  </div>
  <div class="capture-note" role="status" data-denied hidden>
    <svg class="warn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg>
    <span>截图需要「录屏与系统录音」权限，目前被拒绝。</span>
    <button type="button" class="btn primary">打开系统设置</button>
  </div>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script>
// Static state page. ?state=, ?hover= and ?theme=dark select a sub-case (see the header comment). Buttons do nothing.
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.className = 'theme-dark';
  const state = q.get('state'), icon = document.getElementById('menubar-icon');
  if (state === 'collapsed' || state === 'menu') document.getElementById('capture-bar-wrap').hidden = true;
  if (state === 'menu') {
    const menu = document.getElementById('menubar-menu'), r = icon.getBoundingClientRect();
    menu.hidden = false; menu.style.left = Math.round(r.right - menu.offsetWidth) + 'px'; icon.setAttribute('aria-expanded', 'true');
  }
  if (state === 'denied') for (const e of document.querySelectorAll('[data-denied]')) e.hidden = false;
  const hover = document.querySelector('.capture-bar [data-action="' + q.get('hover') + '"]');
  if (hover && !state) {
    hover.classList.add('is-hover');
    const [name, keys] = hover.title.split(' '), tip = document.getElementById('tooltip'), r = hover.getBoundingClientRect();
    tip.innerHTML = name + '<kbd>' + keys + '</kbd>'; tip.hidden = false;
    tip.style.left = Math.round(r.left) + 'px'; tip.style.top = Math.round(r.bottom + 10) + 'px';
  }
})();
</script>
